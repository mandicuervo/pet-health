<main class="record-shell">
  <app-page-header
    [eyebrowText]="pet().name"
    titleKey="records.title"
    descriptionKey="records.intro"
    [descriptionParams]="{ name: pet().name }"
    backLink="/"
    backLabelKey="records.back"
  />

  <nav class="record-tabs" role="tablist" [attr.aria-label]="'records.chooseType' | translate">
    @for (tab of tabs(); track tab.id) {
      <button
        class="record-tab"
        [class.active]="activeTab() === tab.id"
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === tab.id"
        (click)="selectTab(tab.id)"
      >
        {{ tab.labelKey | translate }}
      </button>
    }
  </nav>

  @if (tabs().length === 0) {
    <p class="empty-state">{{ 'records.noEnabledTypes' | translate }}</p>
  } @else if (activeTab() === 'food') {
    <app-food-form (saved)="onFoodSaved()" />
  } @else {
    <app-health-entry-form [entryType]="healthEntryType()" (saved)="onHealthEntrySaved()" />
  }

  @if (errorKey()) {
    <p class="form-message error" role="alert">{{ errorKey() | translate }}</p>
  }
  @if (successKey()) {
    <p class="form-message success" role="status">{{ successKey() | translate }}</p>
  }
</main>
