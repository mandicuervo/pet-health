<section class="food-form-card" [attr.aria-label]="'foods.foodForm' | translate">
  <h3>{{ (food() ? 'foods.editFood' : 'foods.addFood') | translate }}</h3>
  <form (submit)="save($event)">
    <label class="form-field">
      <span>{{ 'foods.foodName' | translate }}</span>
      <input name="name" type="text" maxlength="80" [value]="food()?.name ?? ''" required />
    </label>
    <label class="form-field">
      <span>{{ 'foods.brand' | translate }}</span>
      <input name="brand" type="text" maxlength="80" [value]="food()?.brand ?? ''" />
    </label>
    <label class="form-field">
      <span>{{ 'foods.category' | translate }}</span>
      <select name="category" [value]="food()?.category ?? 'dryFood'" required>
        <option value="dryFood">{{ 'foods.dryFood' | translate }}</option>
        <option value="wetFood">{{ 'foods.wetFood' | translate }}</option>
        <option value="treat">{{ 'foods.treat' | translate }}</option>
      </select>
    </label>
    <label class="form-field">
      <span>{{ 'foods.energyDensity' | translate }}</span>
      <input
        name="kcalPer100g"
        type="number"
        min="0.1"
        max="1000"
        step="0.1"
        [value]="food() ? food()!.kcalPerKg / 10 : ''"
        required
      />
    </label>
    <label class="form-field">
      <span>{{ 'foods.caloriesPerUnit' | translate }}</span>
      <input
        name="kcalPerUnit"
        type="number"
        min="0"
        max="1000"
        step="0.1"
        [value]="food()?.kcalPerUnit ?? ''"
      />
    </label>
    <label class="form-field">
      <span>{{ 'foods.fiberPercent' | translate }}</span>
      <input
        name="fiberPercent"
        type="number"
        min="0"
        max="100"
        step="0.1"
        [value]="food()?.fiberPercent ?? ''"
      />
    </label>
    <label class="form-field">
      <span>{{ 'foods.proteinPercent' | translate }}</span>
      <input
        name="proteinPercent"
        type="number"
        min="0"
        max="100"
        step="0.1"
        [value]="food()?.proteinPercent ?? ''"
      />
    </label>
    @if (errorKey()) {
      <p class="form-error" role="alert">{{ errorKey() | translate }}</p>
    }
    <div class="form-actions">
      <button class="secondary-button" type="button" (click)="cancelled.emit()">
        {{ 'foods.cancel' | translate }}
      </button>
      <button class="primary-button" type="submit">{{ 'foods.save' | translate }}</button>
    </div>
  </form>
</section>
